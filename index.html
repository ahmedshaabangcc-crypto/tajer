  <!-- Instant splash: plain HTML painted on the first frame, so someone who
       scans a shop's QR on mobile data sees something right away instead of
       a blank page while the app (several MB) downloads. Removed when
       Flutter draws its first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B1530; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0B1530; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #FFFFFF; transition: opacity .25s ease;
    }
    #splash img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 6px 24px rgba(11,35,64,.15); }
    #splash .name { font-size: 22px; font-weight: 800; }
    #splash .msg { font-size: 14px; color: rgba(255,255,255,.65); }
    #splash .bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #F2B661;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(260%); } 100% { transform: translateX(-120%); } }
  </style>
  <link rel="manifest" href="manifest.json">
  <script>
    // "Add to home screen": Chrome/Android fires beforeinstallprompt; we keep
    // it so the app can offer its own install button (iOS has no prompt —
    // the app shows Share → Add to Home Screen instructions instead).
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installEvt = e; });
    window.mogtama3yCanInstall = function () { return !!window.__installEvt; };
    window.mogtama3yInstall = function () {
      var e = window.__installEvt; if (!e) return false;
      e.prompt(); window.__installEvt = null; return true;
    };
    window.mogtama3yIsStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
    window.mogtama3yIsIOS = function () { return /iphone|ipad|ipod/i.test(navigator.userAgent); };
  </script>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LW5F70SQN3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LW5F70SQN3');
  </script>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">متجري</div>
    <div class="msg" id="splash-msg">جارٍ التحميل…</div>
    <div class="bar"></div>
  </div>
  <script>
    (function () {
      var hash = location.hash || '';
      var msg = document.getElementById('splash-msg');
      if (hash.indexOf('#/s/') === 0) msg.textContent = 'بنفتحلك المتجر…';
      else if (hash.indexOf('#/merchant') === 0) msg.textContent = 'بنفتحلك لوحة التاجر…';
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('splash');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 300);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Instant store page for /#/s/<slug> links while Flutter loads. -->
  <script src="store-lite.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
